[InventoryFilter]
;Enable or disable the filter
Enable=1

;Specify localization language, use language folder names
;the default localization set in the game settings is used
;Language=english

;List of pid numbers for additional items in the "Tools" filter group.
;Fallout: PID_MULTI_TOOL, PID_ELECTRONIC_LOCKPICKS, PID_LOCKPICKS, PID_SUPER_TOOL_KIT, PID_EXP_LOCKPICK_SET, PID_ELEC_LOCKPICK_MKII
;Nevada:  556, 557, 647
;Olympus: 247, 393
ToolGroupPids=75, 77, 84, 308, 410, 411, 556, 557, 647, 247, 393

;List of pid numbers for additional items in the "Custom" filter group.
;Default: skill books. Key/quest items are also included automatically.
CustomGroupPids=73, 76, 80, 86, 102

;Set to 1 to show weight information and the trader's caps.
ShowWeight=1
ShowCaps=1

;Display container capacity as a percentage, instead of its size in units.
PercentSize=1

;Text color for displaying numeric weight and caps values
;0 - green, 1 - yellow, 2 - white
TextColor=2

;Enable smart trading mode.
;The trader or player will always give the missing money (if available in the inventory) at the end of the deal.
SmartBarter=0

;Enable the "Drop All" button to move all inventory items when exchanging with containers.
DropAllButton=1

;The code for the "Drop All" hot key. It works regardless of the DropAllButton option.
;32 - 'D' key scancode
DropAllButtonKey=32

;Filter categories whose items "Drop All" never moves, separated by commas.
;Names: melee, wlight, weapon, ammo, armor, drug, tool, custom, misc. The custom category holds the keys and the items of CustomGroupPids.
;Empty: nothing is protected.
DropAllProtectedCategories=custom

;List of pid numbers of items that "Drop All" never moves (quest items, for example).
DropAllProtectedPids=

;Use the additional background image for the "Drop All" button.
;The panel uses an image of the Fallout 2 interface; with a different interface it is recommended to disable this option, or to use another image.
UseBackImage=1

;Use different "Drop All" button images for containers and NPCs.
UseGiveAllImage=1

;0 - the Drop All, Give All and Take All buttons show a text in the language of the game (when a picture exists for it)
;1 - icons only, without text
IconOnlyButtons=0

;Keep selected filters when closing and reopening the interface.
;0 - disabled, 1 - enabled
;These are the player's filters; the container, merchant and party member filters have their own settings below.
KeepFilters=1

;Keep the filters of the right inventory when looting a container or a body, and bring them back next time.
;0 - disabled, 1 - enabled
KeepLootFilters=0

;Keep the filters of the right inventory with a party member (looting or bartering), and bring them back next time.
;0 - disabled, 1 - enabled
KeepCompanionFilters=0

;Keep the filters of the right inventory when bartering with a merchant, and bring them back next time.
;0 - disabled, 1 - enabled
KeepMerchantFilters=0

;Maximum number of items handled in one inventory (filters, sorting, original order).
;Raise it if you carry more items than that (1 to 9999).
MaxItems=1000

;Enable swapping with party members during barter or when exchanging with containers.
SwapParty=1
SwapContainers=1

;Maximum distance, in hexes, between the player and a party member for swapping with them (0 = no limit).
SwapMaxDistance=0

;Offset of the position of the party swap panel along the X axis.
SwapBarterOffset=0
SwapLootOffset=0

;Offset of the position of the "weight" window in the player interface along the Y axis.
WeightWinShift=0

;Position of the filter interface in the barter mode.
;Set 1 so that the interface position is the same as in older versions (before version 2.0)
OldPosition=0

[HotKeys]
;DX scancodes for hot keys. Do not change the order of the parameters!
;for the player: keys 1, 2, 3, 4, 5, 6, 7, 8, 9
pMelee=2
pWLight=3
pWeapon=4
pAmmo=5
pArmor=6
pDrug=7
pTool=8
pCustom=9
pMisc=10
;for NPC/container: press the prefix key 0, then 1, 2, 3, 4, 5, 6, 7, 8 or 9
nPrefix=11
nMelee=2
nWLight=3
nWeapon=4
nAmmo=5
nArmor=6
nDrug=7
nTool=8
nCustom=9
nMisc=10
